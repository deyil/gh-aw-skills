name: Update CHANGELOG.md

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-changelog
  cancel-in-progress: false

jobs:
  sync:
    name: Sync changelog entry
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish || '' }}

      - name: Verify branch checkout
        run: |
          set -euo pipefail

          if ! git symbolic-ref -q HEAD >/dev/null; then
            echo "::error::Checkout is in detached HEAD state. Cannot push the changelog commit." >&2
            exit 1
          fi

      - name: Fetch release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq 'map(select(.draft == false))')"

          if [[ -n "$EVENT_TAG" ]]; then
            latest="$(echo "$releases" | jq --arg t "$EVENT_TAG" \
              'map(select(.tag_name == $t)) | .[0]')"
          else
            latest="$(echo "$releases" | jq '.[0]')"
          fi

          if [[ -z "$latest" || "$latest" == "null" ]]; then
            echo "No matching published release found." >&2
            exit 1
          fi

          tag="$(echo "$latest" | jq -r '.tag_name')"
          name="$(echo "$latest" | jq -r '.name // ""')"
          url="$(echo "$latest" | jq -r '.html_url')"
          published_at="$(echo "$latest" | jq -r '.published_at // ""')"
          body="$(echo "$latest" | jq -r '.body // ""')"
          prerelease="$(echo "$latest" | jq -r '.prerelease')"

          {
            echo "tag=$tag"
            echo "name=$name"
            echo "url=$url"
            echo "published_at=$published_at"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

          body_delimiter="body-$(uuidgen)"
          {
            echo "body<<$body_delimiter"
            if [[ -n "$body" ]]; then
              printf '%s\n' "$body"
            else
              echo "- No release notes were provided for this release."
            fi
            echo "$body_delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Build and write changelog entry
        id: changelog
        env:
          TAG: ${{ steps.release.outputs.tag }}
          NAME: ${{ steps.release.outputs.name }}
          URL: ${{ steps.release.outputs.url }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          BODY: ${{ steps.release.outputs.body }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail

          # --- Heading ---
          release_title="$TAG"
          if [[ -n "$NAME" ]]; then
            release_title="$NAME"
          fi

          release_date="${PUBLISHED_AT%%T*}"
          if [[ -z "$release_date" ]]; then
            release_date="$(date -u +%F)"
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            heading="## [$release_title]($URL) - $release_date [prerelease]"
          else
            heading="## [$release_title]($URL) - $release_date"
          fi

          existing_sections_file="$(mktemp)"
          cleanup_existing_sections() {
            rm -f "$existing_sections_file"
          }
          trap cleanup_existing_sections EXIT

          if [[ -f CHANGELOG.md ]]; then
            awk -v url="$URL" '
              BEGIN {
                skipping = 0
              }
              /^## \[/ {
                skipping = index($0, "](" url ")") > 0
              }
              !skipping {
                print
              }
            ' CHANGELOG.md | sed -n '/^## /,$p' > "$existing_sections_file"
          fi

          tmp_file="$(mktemp)"
          {
            echo "# Changelog"
            echo
            echo "All notable changes to this project will be documented in this file."
            echo
            echo "Release entries are synchronized from published GitHub releases."
            echo
            echo "$heading"
            echo
            printf '%s\n' "$BODY"
            echo
            if [[ -s "$existing_sections_file" ]]; then
              cat "$existing_sections_file"
            fi
          } > "$tmp_file"

          if [[ -f CHANGELOG.md ]] && cmp -s "$tmp_file" CHANGELOG.md; then
            rm -f "$tmp_file"
            echo "Changelog already matches the generated release entry."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mv "$tmp_file" CHANGELOG.md
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        env:
          TAG: ${{ steps.release.outputs.tag }}
          CHANGED: ${{ steps.changelog.outputs.changed }}
        run: |
          set -euo pipefail

          if [[ "$CHANGED" != "true" ]]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          git commit -m "docs: update changelog for $TAG"
          git push origin HEAD

      - name: Summarize
        env:
          TAG: ${{ steps.release.outputs.tag }}
          CHANGED: ${{ steps.changelog.outputs.changed }}
        run: |
          set -euo pipefail

          {
            echo "### Changelog sync"
            echo
            echo "- Release: $TAG"
            echo "- Changelog updated: $CHANGED"
          } >> "$GITHUB_STEP_SUMMARY"
