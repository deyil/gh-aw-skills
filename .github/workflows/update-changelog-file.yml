name: Update CHANGELOG.md

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-changelog
  cancel-in-progress: false

jobs:
  sync:
    name: Sync changelog entry
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.target_commitish || '' }}

      - name: Verify branch checkout
        run: |
          set -euo pipefail

          if ! git symbolic-ref -q HEAD >/dev/null; then
            echo "::error::Checkout is in detached HEAD state. Cannot push the changelog commit." >&2
            exit 1
          fi

      - name: Fetch release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq 'map(select(.draft == false))')"

          if [[ -n "$EVENT_TAG" ]]; then
            latest="$(echo "$releases" | jq --arg t "$EVENT_TAG" \
              'map(select(.tag_name == $t)) | .[0]')"
          else
            latest="$(echo "$releases" | jq '.[0]')"
          fi

          if [[ -z "$latest" || "$latest" == "null" ]]; then
            echo "No matching published release found." >&2
            exit 1
          fi

          tag="$(echo "$latest" | jq -r '.tag_name')"
          name="$(echo "$latest" | jq -r '.name // ""')"
          url="$(echo "$latest" | jq -r '.html_url')"
          published_at="$(echo "$latest" | jq -r '.published_at // ""')"
          body="$(echo "$latest" | jq -r '.body // ""')"
          prerelease="$(echo "$latest" | jq -r '.prerelease')"

          previous_tag="$(echo "$releases" | jq -r --arg t "$tag" '
            (to_entries | map(select(.value.tag_name == $t)) | .[0].key) as $idx |
            if $idx == null then ""
            elif ($idx + 1) < length then .[$idx + 1].tag_name
            else "" end
          ')"

          {
            echo "tag=$tag"
            echo "name=$name"
            echo "url=$url"
            echo "published_at=$published_at"
            echo "prerelease=$prerelease"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"

          body_delimiter="body-$(uuidgen)"
          {
            echo "body<<$body_delimiter"
            if [[ -n "$body" ]]; then
              printf '%s\n' "$body"
            else
              echo "- No release notes were provided for this release."
            fi
            echo "$body_delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Build and write changelog entry
        id: changelog
        env:
          TAG: ${{ steps.release.outputs.tag }}
          NAME: ${{ steps.release.outputs.name }}
          URL: ${{ steps.release.outputs.url }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          BODY: ${{ steps.release.outputs.body }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
        run: |
          set -euo pipefail

          # Deduplicate: skip if entry for this release URL already exists.
          if [[ -f CHANGELOG.md ]] && awk -v url="$URL" '
            /^## \[/ && index($0, "](" url ")") { found=1; exit }
            END { exit !found }
          ' CHANGELOG.md; then
            echo "Changelog already contains an entry for this release; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- Heading ---
          release_title="$TAG"
          if [[ -n "$NAME" ]]; then
            release_title="$NAME"
          fi

          release_date="${PUBLISHED_AT%%T*}"
          if [[ -z "$release_date" ]]; then
            release_date="$(date -u +%F)"
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            heading="## [$release_title]($URL) - $release_date [prerelease]"
          else
            heading="## [$release_title]($URL) - $release_date"
          fi

          # --- Full Commit List ---
          commit_section="$(mktemp)"
          trap 'rm -f "$commit_section"' EXIT

          if [[ -n "$PREVIOUS_TAG" ]]; then
            commit_range="${PREVIOUS_TAG}..${TAG}"
            range_label="${PREVIOUS_TAG}...${TAG}"
          else
            commit_range=""
            range_label="initial release"
          fi

          {
            echo
            echo "## Full Commit List"
            echo
            echo "Range: $range_label"
            echo
          } > "$commit_section"

          commit_count=0
          if [[ -n "$commit_range" ]]; then
            while IFS=$'\t' read -r sha subject; do
              [[ -z "$sha" ]] && continue
              commit_count=$((commit_count + 1))
              short="$(git rev-parse --short "$sha")"
              printf -- '- %s ([`%s`](https://github.com/%s/commit/%s))\n' \
                "$subject" "$short" "$GITHUB_REPOSITORY" "$sha" >> "$commit_section"
            done < <(git log --reverse --format='%H%x09%s' "$commit_range")
          else
            echo "- Initial release; full commit history omitted." >> "$commit_section"
          fi

          if [[ -n "$commit_range" && "$commit_count" -eq 0 ]]; then
            echo "- No commits found for this release range." >> "$commit_section"
          fi

          # --- Footer ---
          {
            echo
            echo "---"
            if [[ -n "$PREVIOUS_TAG" ]]; then
              printf '[Compare changes](https://github.com/%s/compare/%s...%s) | ' \
                "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$TAG"
            fi
            printf '[Release page](%s)\n' "$URL"
          } >> "$commit_section"

          # --- Assemble CHANGELOG.md ---
          entry_body="${BODY}"$'\n'"$(cat "$commit_section")"

          tmp_file="$(mktemp)"
          {
            echo "# Changelog"
            echo
            echo "All notable changes to this project will be documented in this file."
            echo
            echo "Release entries are synchronized from published GitHub releases."
            echo
            echo "$heading"
            echo
            printf '%s\n' "$entry_body"
            echo
            if [[ -f CHANGELOG.md ]]; then
              sed -n '/^## /,$p' CHANGELOG.md
            fi
          } > "$tmp_file"

          mv "$tmp_file" CHANGELOG.md
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        env:
          TAG: ${{ steps.release.outputs.tag }}
          CHANGED: ${{ steps.changelog.outputs.changed }}
        run: |
          set -euo pipefail

          if [[ "$CHANGED" != "true" ]]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          git commit -m "docs: update changelog for $TAG"
          git push origin HEAD

      - name: Summarize
        env:
          TAG: ${{ steps.release.outputs.tag }}
          CHANGED: ${{ steps.changelog.outputs.changed }}
        run: |
          set -euo pipefail

          {
            echo "### Changelog sync"
            echo
            echo "- Release: $TAG"
            echo "- Changelog updated: $CHANGED"
          } >> "$GITHUB_STEP_SUMMARY"
