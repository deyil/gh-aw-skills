name: Update CHANGELOG.md

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to sync to changelog
        required: true
        type: string
      generate_from_head:
        description: Generate release notes from HEAD instead of from the tag ref
        required: false
        type: boolean
        default: false
      target:
        description: Branch or commit to check out before updating the changelog
        required: false
        type: string
        default: ''
      prerelease:
        description: Mark the changelog entry as a prerelease
        required: false
        type: boolean
        default: false
    outputs:
      commit_sha:
        description: SHA of the changelog commit (or current HEAD if unchanged)
        value: ${{ jobs.sync.outputs.commit_sha }}
      release_body:
        description: Assembled release body used for the changelog entry
        value: ${{ jobs.sync.outputs.release_body }}
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sync to changelog
        required: true
        type: string
      generate_from_head:
        description: Generate release notes from HEAD instead of from the tag ref
        required: false
        default: false
        type: boolean
      target:
        description: Branch or commit to check out before updating the changelog
        required: false
        type: string
        default: ''
      prerelease:
        description: Mark the changelog entry as a prerelease
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-changelog
  cancel-in-progress: false

jobs:
  sync:
    name: Sync changelog entry
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      release_body: ${{ steps.meta.outputs.release_body }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target || github.event.release.target_commitish || '' }}

      - name: Verify branch checkout
        run: |
          set -euo pipefail

          if ! git symbolic-ref -q HEAD >/dev/null; then
            echo "::error::Checkout is in detached HEAD state. The 'target' input must be a branch name (not a commit SHA) so the changelog commit can be pushed." >&2
            exit 1
          fi

      - name: Prepare release metadata
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          NAME: ${{ github.event.release.name }}
          URL: ${{ github.event.release.html_url }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          BODY: ${{ github.event.release.body }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
          GENERATE_FROM_HEAD: ${{ inputs.generate_from_head }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          trap_files=()
          cleanup() {
            for file in "${trap_files[@]}"; do
              if [[ -n "$file" && -f "$file" ]]; then
                rm -f "$file"
              fi
            done
          }
          trap cleanup EXIT

          if [[ -z "$TAG" ]]; then
            echo "Release tag is required." >&2
            exit 1
          fi

          if [[ ! "$TAG" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Release tag contains unsupported characters: $TAG" >&2
            exit 1
          fi

          # Default release metadata values used in paths where release does not exist yet.
          NAME="${NAME:-}"
          URL="${URL:-}"
          PUBLISHED_AT="${PUBLISHED_AT:-}"
          BODY="${BODY:-}"
          PRERELEASE="${PRERELEASE:-false}"

          previous_tag=""
          commit_target=""
          append_full_commit_list="false"

          # Path 1: release event payload already contains release metadata.
          if [[ -n "$URL" ]]; then
            :
          else
            # Path 2: attempt to fetch existing release by tag.
            encoded_tag="$(jq -rn --arg tag "$TAG" "\$tag|@uri")"
            api_error_file="$(mktemp)"
            trap_files+=("$api_error_file")

            if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${encoded_tag}" 2>"$api_error_file")"; then
              NAME="$(echo "$release_json" | jq -r '.name // ""')"
              URL="$(echo "$release_json" | jq -r '.html_url')"
              PUBLISHED_AT="$(echo "$release_json" | jq -r '.published_at // ""')"
              BODY="$(echo "$release_json" | jq -r '.body // ""')"
              PRERELEASE="$(echo "$release_json" | jq -r '.prerelease // false')"
            else
              # Only 404 should fall through to generation path.
              if ! grep -q 'HTTP 404' "$api_error_file"; then
                cat "$api_error_file" >&2
                exit 1
              fi

              # Path 3: release does not exist yet; generate notes from HEAD or tag.
              previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -r 'map(select(.draft == false)) | .[0].tag_name // ""')"

              if [[ "${GENERATE_FROM_HEAD:-false}" == "true" ]]; then
                commit_target="HEAD"
              else
                if ! git rev-parse --verify "$TAG" >/dev/null 2>&1; then
                  echo "Release tag or ref not found: $TAG" >&2
                  echo "Provide an existing tag/ref or enable generate_from_head to build notes from HEAD." >&2
                  exit 1
                fi
                commit_target="$TAG"
              fi

              generate_args="$(jq -n \
                --arg tag_name "$TAG" \
                --arg target_commitish "$commit_target" \
                --arg previous_tag "$previous_tag" \
                "if \$previous_tag != \"\" then {tag_name: \$tag_name, target_commitish: \$target_commitish, previous_tag_name: \$previous_tag} else {tag_name: \$tag_name, target_commitish: \$target_commitish} end"
              )"

              BODY="$(echo "$generate_args" | gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" --input - --jq '.body')"
              URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
              PUBLISHED_AT="$(date -u +%FT%TZ)"
              append_full_commit_list="true"
              if [[ "${PRERELEASE_INPUT}" == "true" ]]; then
                PRERELEASE="true"
              else
                PRERELEASE="false"
              fi
            fi
          fi

          release_title="$TAG"
          if [[ -n "$NAME" ]]; then
            release_title="$NAME"
          fi

          release_date="${PUBLISHED_AT%%T*}"
          if [[ -z "$release_date" ]]; then
            release_date="$(date -u +%F)"
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            heading="## [$release_title]($URL) - $release_date [prerelease]"
          else
            heading="## [$release_title]($URL) - $release_date"
          fi

          assembled_body="$BODY"
          if [[ "$append_full_commit_list" == "true" ]]; then
            if [[ -n "$previous_tag" ]]; then
              commit_range="${previous_tag}..${commit_target}"
              range_label="${previous_tag}...${commit_target}"
            else
              commit_range=""
              range_label="initial release"
            fi

            full_commit_section="$(mktemp)"
            trap_files+=("$full_commit_section")
            {
              echo
              echo "## Full Commit List"
              echo
              echo "Range: $range_label"
              echo
            } > "$full_commit_section"

            commit_count=0
            if [[ -n "$commit_range" ]]; then
              while IFS=$'\t' read -r commit_sha commit_subject; do
                if [[ -z "$commit_sha" ]]; then
                  continue
                fi
                commit_count=$((commit_count + 1))
                short_sha="$(git rev-parse --short "$commit_sha")"
                printf -- "- %s ([\`%s\`](%s/%s/commit/%s))\n" \
                  "$commit_subject" \
                  "$short_sha" \
                  "$GITHUB_SERVER_URL" \
                  "$GITHUB_REPOSITORY" \
                  "$commit_sha" >> "$full_commit_section"
              done < <(git log --reverse --format='%H%x09%s' "$commit_range")
            else
              echo "- Initial release; full commit history omitted." >> "$full_commit_section"
            fi

            if [[ -n "$commit_range" && "$commit_count" -eq 0 ]]; then
              echo "- No commits found for this release range." >> "$full_commit_section"
            fi

            assembled_body="${BODY}"$'\n'"$(cat "$full_commit_section")"
          fi

          heading_delimiter="heading-$(uuidgen)"
          body_delimiter="body-$(uuidgen)"
          release_body_delimiter="release-body-$(uuidgen)"
          {
            echo "url=$URL"
            echo "heading<<$heading_delimiter"
            printf '%s\n' "$heading"
            echo "$heading_delimiter"
            echo "body<<$body_delimiter"
            if [[ -n "$assembled_body" ]]; then
              printf '%s\n' "$assembled_body"
            else
              echo "- No release notes were provided for this release."
            fi
            echo "$body_delimiter"
            echo "release_body<<$release_body_delimiter"
            if [[ -n "$assembled_body" ]]; then
              printf '%s\n' "$assembled_body"
            else
              echo "- No release notes were provided for this release."
            fi
            echo "$release_body_delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Update changelog
        id: changelog
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          HEADING: ${{ steps.meta.outputs.heading }}
          BODY: ${{ steps.meta.outputs.body }}
          URL: ${{ steps.meta.outputs.url }}
        run: |
          set -euo pipefail

          tmp_file=''
          trap 'if [[ -n "$tmp_file" ]]; then rm -f "$tmp_file"; fi' EXIT

          if [[ -f CHANGELOG.md ]] && awk -v url="$URL" '
            /^## \[/ && index($0, "](" url ")") { found=1; exit }
            END { exit !found }
          ' CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tmp_file="$(mktemp)"
          {
            echo "# Changelog"
            echo
            echo "All notable changes to this project will be documented in this file."
            echo
            echo "Release entries are synchronized from published GitHub releases."
            echo
            echo "$HEADING"
            echo
            printf '%s\n' "$BODY"
            echo
            if [[ -f CHANGELOG.md ]]; then
              sed -n '/^## /,$p' CHANGELOG.md
            fi
          } > "$tmp_file"

          mv "$tmp_file" CHANGELOG.md
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit changelog and output SHA
        id: commit
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          CHANGED: ${{ steps.changelog.outputs.changed }}
        run: |
          set -euo pipefail

          if [[ "$CHANGED" == "true" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add CHANGELOG.md

            commit_message_file="$(mktemp)"
            trap 'rm -f "$commit_message_file"' EXIT
            printf 'docs: update changelog for %s\n' "$TAG" > "$commit_message_file"

            git commit -F "$commit_message_file"
            git push origin HEAD
          fi

          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Summarize changelog sync
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          CHANGED: ${{ steps.changelog.outputs.changed }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          set -euo pipefail

          {
            echo "### Changelog sync"
            echo
            echo "- Release: $TAG"
            echo "- Changelog updated: $CHANGED"
            echo "- Commit SHA: $COMMIT_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
