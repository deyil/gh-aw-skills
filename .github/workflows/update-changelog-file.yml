name: Update CHANGELOG.md

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-changelog
  cancel-in-progress: false

jobs:
  sync:
    name: Sync changelog entry
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish || '' }}

      - name: Verify branch checkout
        run: |
          set -euo pipefail

          if ! git symbolic-ref -q HEAD >/dev/null; then
            echo "::error::Checkout is in detached HEAD state. Cannot push the changelog commit." >&2
            exit 1
          fi

      - name: Build changelog content
        id: changelog_data
        uses: ./.github/actions/build-changelog-entry
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          event-tag: ${{ github.event.release.tag_name }}
          changelog-path: CHANGELOG.md

      - name: Build and write changelog entry
        id: changelog
        env:
          GENERATED_CHANGELOG: ${{ steps.changelog_data.outputs.generated-changelog }}
        run: |
          set -euo pipefail

          tmp_file="$(mktemp)"
          printf '%s\n' "$GENERATED_CHANGELOG" > "$tmp_file"

          if [[ -f CHANGELOG.md ]] && cmp -s "$tmp_file" CHANGELOG.md; then
            rm -f "$tmp_file"
            echo "Changelog already matches the generated release entry."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mv "$tmp_file" CHANGELOG.md
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        env:
          TAG: ${{ steps.changelog_data.outputs.tag }}
          CHANGED: ${{ steps.changelog.outputs.changed }}
        run: |
          set -euo pipefail

          if [[ "$CHANGED" != "true" ]]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          git commit -m "docs: update changelog for $TAG"
          git push origin HEAD

      - name: Summarize
        env:
          TAG: ${{ steps.changelog_data.outputs.tag }}
          CHANGED: ${{ steps.changelog.outputs.changed }}
        run: |
          set -euo pipefail

          {
            echo "### Changelog sync"
            echo
            echo "- Release: $TAG"
            echo "- Changelog updated: $CHANGED"
          } >> "$GITHUB_STEP_SUMMARY"
