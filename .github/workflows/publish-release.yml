name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or publish, for example v1.2.3. Leave blank to auto-increment the minor version of the last release.
        required: false
        default: ""
        type: string
      title:
        description: Release title prefix. The resolved tag is always appended (e.g. "My Release v1.3.0"). Leave blank to use only the tag.
        required: false
        default: ""
        type: string
      target:
        description: Branch to target for the release. Must be an existing branch for published releases. Defaults to main.
        required: false
        default: main
        type: string
      prerelease:
        description: Mark the release as a prerelease.
        required: false
        default: false
        type: boolean
      draft:
        description: Create the release as a draft instead of publishing it.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-changelog-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      resolved_tag: ${{ steps.resolve.outputs.resolved_tag }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      release_title: ${{ steps.resolve.outputs.release_title }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and title
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          encoded_target="$(jq -rn --arg target "$TARGET" "\$target|@uri")"
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_target}" >/dev/null 2>&1; then
            echo "Target must be an existing branch name for releases: $TARGET" >&2
            exit 1
          fi

          git fetch --force --tags origin
          git fetch --force origin "+refs/heads/*:refs/remotes/origin/*"

          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -s 'add | map(select(.draft == false))')"
          branch_release_tags_file="$(mktemp)"
          cleanup_branch_release_tags() {
            rm -f "$branch_release_tags_file"
          }
          trap cleanup_branch_release_tags EXIT

          while IFS= read -r release_tag; do
            [[ -z "$release_tag" ]] && continue
            if ! git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null 2>&1; then
              continue
            fi

            tag_commit="$(git rev-list -n 1 "refs/tags/${release_tag}")"
            if git merge-base --is-ancestor "$tag_commit" "refs/remotes/origin/${TARGET}"; then
              printf '%s\n' "$release_tag" >> "$branch_release_tags_file"
            fi
          done < <(printf '%s' "$releases" | jq -r '.[].tag_name // ""')

          previous_tag="$(head -n 1 "$branch_release_tags_file" || true)"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"

          if [[ -n "$INPUT_TAG" ]]; then
            resolved_tag="$INPUT_TAG"
          elif [[ -n "$previous_tag" ]]; then
            # Bump the minor segment and reset patch for supported tags, including repo form v.1.2.3.
            if [[ "$previous_tag" =~ ^(v\.?)?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              tag_prefix="${BASH_REMATCH[1]}"
              major="${BASH_REMATCH[2]}"
              minor="${BASH_REMATCH[3]}"
              resolved_tag="${tag_prefix}${major}.$((minor + 1)).0"
            else
              echo "Cannot auto-increment from previous release tag: $previous_tag" >&2
              echo "Supported format is v<major>.<minor>.<patch>, v.<major>.<minor>.<patch>, or <major>.<minor>.<patch>. Provide an explicit tag input." >&2
              exit 1
            fi
          else
            echo "No tag provided and no previous release found to auto-increment from." >&2
            exit 1
          fi

          if [[ ! "$resolved_tag" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Release tag contains unsupported characters: $resolved_tag" >&2
            exit 1
          fi

          echo "resolved_tag=${resolved_tag}" >> "$GITHUB_OUTPUT"

          if [[ -n "$TITLE" ]]; then
            release_title="$TITLE $resolved_tag"
          else
            release_title="$resolved_tag"
          fi
          echo "release_title=${release_title}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish GitHub release
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Validate target branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          encoded_target="$(jq -rn --arg target "$TARGET" "\$target|@uri")"
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_target}" >/dev/null 2>&1; then
            echo "Target must be an existing branch name for published releases: $TARGET" >&2
            exit 1
          fi

      - name: Check out target history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target }}

      - name: Assemble release notes and commit appendix
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.resolved_tag }}
          TARGET: ${{ inputs.target }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: |
          set -euo pipefail

          generate_args="$(jq -n \
            --arg tag_name "$TAG" \
            --arg target_commitish "$TARGET" \
            --arg previous_tag "$PREVIOUS_TAG" \
            "if \$previous_tag != \"\" then {tag_name: \$tag_name, target_commitish: \$target_commitish, previous_tag_name: \$previous_tag} else {tag_name: \$tag_name, target_commitish: \$target_commitish} end"
          )"

          generated_body="$(printf "%s" "$generate_args" | gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" --input - --jq '.body')"
          if [[ -z "$generated_body" ]]; then
            generated_body="- No release notes were provided for this release."
          fi

          commit_section="$(mktemp)"
          cleanup_commit_section() {
            rm -f "$commit_section"
          }
          trap cleanup_commit_section EXIT

          if [[ -n "$PREVIOUS_TAG" ]]; then
            commit_range="${PREVIOUS_TAG}..HEAD"
            range_label="${PREVIOUS_TAG}...${TAG}"
          else
            commit_range=""
            range_label="initial release"
          fi

          {
            echo "## Full Commit List"
            echo
            echo "Range: $range_label"
            echo
          } > "$commit_section"

          commit_count=0
          if [[ -n "$commit_range" ]]; then
            while IFS=$'\t' read -r sha subject; do
              [[ -z "$sha" ]] && continue
              commit_count=$((commit_count + 1))
              short="$(git rev-parse --short "$sha")"
              printf -- "- %s ([\`%s\`](%s/%s/commit/%s))\n" \
                "$subject" "$short" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$sha" >> "$commit_section"
            done < <(git log --reverse --format='%H%x09%s' "$commit_range")
          else
            echo "- Initial release; full commit history omitted." >> "$commit_section"
          fi

          if [[ -n "$commit_range" && "$commit_count" -eq 0 ]]; then
            echo "- No commits found for this release range." >> "$commit_section"
          fi

          appendix_delimiter="appendix-$(uuidgen)"
          {
            echo "appendix_markdown<<$appendix_delimiter"
            cat "$commit_section"
            echo "$appendix_delimiter"
          } >> "$GITHUB_OUTPUT"

          body_delimiter="body-$(uuidgen)"
          {
            echo "main_body_markdown<<$body_delimiter"
            printf '%s\n' "$generated_body"
            echo "$body_delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Render release and changelog markdown
        id: render
        uses: ./.github/actions/changelog-render
        with:
          tag: ${{ needs.prepare.outputs.resolved_tag }}
          title: ${{ needs.prepare.outputs.release_title }}
          release_url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.resolved_tag }}
          prerelease: ${{ inputs.prerelease }}
          previous_tag: ${{ needs.prepare.outputs.previous_tag }}
          main_body_markdown: ${{ steps.notes.outputs.main_body_markdown }}
          appendix_markdown: ${{ steps.notes.outputs.appendix_markdown }}

      - name: Merge changelog entry
        if: inputs.draft == false
        id: changelog
        env:
          CHANGELOG_ENTRY: ${{ steps.render.outputs.rendered_changelog_entry }}
        run: |
          set -euo pipefail

          tmp_file="$(mktemp)"
          trap 'rm -f "$tmp_file"' EXIT

          {
            echo "# Changelog"
            echo
            echo "All notable changes to this project will be documented in this file."
            echo
            echo "Release entries are added by publish-release runs and can be repaired manually."
            echo
            printf '%s\n' "$CHANGELOG_ENTRY"
          } > "$tmp_file"

          if [[ -f CHANGELOG.md ]] && cmp -s "$tmp_file" CHANGELOG.md; then
            echo "Changelog already matches the rendered release entry."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mv "$tmp_file" CHANGELOG.md
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push changelog
        if: inputs.draft == false && steps.changelog.outputs.changed == 'true'
        id: writeback
        uses: ./.github/actions/git-writeback
        with:
          branch: ${{ inputs.target }}
          commit_message: "docs: update changelog for ${{ needs.prepare.outputs.resolved_tag }}"
          file_paths: |
            CHANGELOG.md

      - name: Resolve release target commit
        id: release_target
        run: |
          set -euo pipefail

          release_target_sha="$(git rev-parse HEAD)"
          echo "sha=${release_target_sha}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.resolved_tag }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.release_title }}
          RELEASE_TARGET_SHA: ${{ steps.release_target.outputs.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
          RELEASE_BODY: ${{ steps.render.outputs.rendered_release_body }}
        run: |
          set -euo pipefail

          if [[ "$PRERELEASE" != "true" && "$PRERELEASE" != "false" ]]; then
            echo "Unexpected prerelease input value: $PRERELEASE" >&2
            exit 1
          fi
          if [[ "$DRAFT" != "true" && "$DRAFT" != "false" ]]; then
            echo "Unexpected draft input value: $DRAFT" >&2
            exit 1
          fi

          encoded_tag="$(jq -rn --arg tag "$TAG" "\$tag|@uri")"
          release_lookup="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${encoded_tag}" 2>/dev/null || true)"
          existing_release_id="$(printf '%s' "$release_lookup" | jq -r '.id // ""')"
          existing_release_draft="$(printf '%s' "$release_lookup" | jq -r '.draft // false')"
          existing_release_target_commitish="$(printf '%s' "$release_lookup" | jq -r '.target_commitish // ""')"

          matching_draft_releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -cs --arg tag "$TAG" 'add | map(select(.tag_name == $tag and .draft == true))')"
          matching_draft_count="$(printf '%s' "$matching_draft_releases" | jq 'length')"
          matching_draft_ids="$(printf '%s' "$matching_draft_releases" | jq -r '.[].id')"

          if (( matching_draft_count > 0 )); then
            if [[ -z "$existing_release_id" || "$existing_release_draft" != "true" ]]; then
              existing_release_id="$(printf '%s' "$matching_draft_releases" | jq -r '.[0].id // ""')"
              existing_release_draft="true"
              existing_release_target_commitish="$(printf '%s' "$matching_draft_releases" | jq -r '.[0].target_commitish // ""')"
            fi
          fi

          release_payload="$(jq -n \
            --arg tag_name "$TAG" \
            --arg name "$RELEASE_TITLE" \
            --arg body "$RELEASE_BODY" \
            --arg target_commitish "$RELEASE_TARGET_SHA" \
            --argjson prerelease "$PRERELEASE" \
            --argjson draft "$DRAFT" \
            '{tag_name: $tag_name, target_commitish: $target_commitish, name: $name, body: $body, prerelease: $prerelease, draft: $draft}'
          )"

          if [[ -n "$existing_release_id" ]]; then
            replace_existing_release="false"

            if [[ "$existing_release_draft" == "true" ]]; then
              if (( matching_draft_count > 1 )); then
                replace_existing_release="true"
              elif [[ "$DRAFT" == "false" ]]; then
                replace_existing_release="true"
              elif [[ "$existing_release_target_commitish" != "$RELEASE_TARGET_SHA" ]]; then
                replace_existing_release="true"
              fi

              if [[ "$replace_existing_release" != "true" ]]; then
                printf '%s' "$release_payload" | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${existing_release_id}" --input - >/dev/null
                echo "Updated existing draft release $TAG (id: $existing_release_id)."
              fi
            else
              tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${encoded_tag}")"
              tag_object_type="$(printf '%s' "$tag_ref" | jq -r '.object.type // ""')"
              tag_object_sha="$(printf '%s' "$tag_ref" | jq -r '.object.sha // ""')"

              if [[ -z "$tag_object_sha" ]]; then
                echo "Unable to resolve existing tag object for $TAG." >&2
                exit 1
              fi

              if [[ "$tag_object_type" == "tag" ]]; then
                tag_commit_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" --jq '.object.sha // ""')"
                if [[ -z "$tag_commit_sha" ]]; then
                  echo "Unable to resolve commit SHA for annotated tag $TAG." >&2
                  exit 1
                fi
              else
                tag_commit_sha="$tag_object_sha"
              fi

              if [[ "$tag_commit_sha" != "$RELEASE_TARGET_SHA" ]]; then
                echo "Release $TAG already exists, but tag points to $tag_commit_sha instead of expected $RELEASE_TARGET_SHA. Refusing to patch release metadata on mismatched commit." >&2
                exit 1
              fi

              if [[ "$replace_existing_release" != "true" ]]; then
                printf '%s' "$release_payload" | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${existing_release_id}" --input - >/dev/null
                echo "Updated existing release $TAG (id: $existing_release_id)."
              fi
            fi

            if [[ "$replace_existing_release" == "true" ]]; then
              if [[ -n "$matching_draft_ids" ]]; then
                while IFS= read -r draft_release_id; do
                  [[ -z "$draft_release_id" ]] && continue
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${draft_release_id}" >/dev/null
                done <<< "$matching_draft_ids"
              else
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${existing_release_id}" >/dev/null
              fi

              delete_tag_error=""
              if delete_tag_error="$({ gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${encoded_tag}" >/dev/null; } 2>&1)"; then
                :
              else
                if printf '%s' "$delete_tag_error" | grep -Eqi '404|Not Found'; then
                  echo "Tag ref for $TAG was already absent before recreation."
                else
                  printf '%s\n' "$delete_tag_error" >&2
                  echo "Failed to delete existing tag ref for $TAG." >&2
                  exit 1
                fi
              fi

              verify_tag_error=""
              if verify_tag_error="$({ gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${encoded_tag}" >/dev/null; } 2>&1)"; then
                echo "Tag ref for $TAG still exists after deletion attempt; refusing to recreate release." >&2
                exit 1
              else
                if printf '%s' "$verify_tag_error" | grep -Eqi '404|Not Found'; then
                  :
                else
                  printf '%s\n' "$verify_tag_error" >&2
                  echo "Failed to verify tag deletion for $TAG before release recreation." >&2
                  exit 1
                fi
              fi

              printf '%s' "$release_payload" | gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input - >/dev/null
              echo "Replaced existing draft release(s) for $TAG to target ${RELEASE_TARGET_SHA}."
            fi
          else
            printf '%s' "$release_payload" | gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input - >/dev/null
            echo "Created release $TAG."
          fi

      - name: Summarize release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.resolved_tag }}
          TARGET: ${{ inputs.target }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          DRAFT: ${{ inputs.draft }}
          CHANGELOG_CHANGED: ${{ steps.changelog.outputs.changed }}
          WRITEBACK_CHANGED: ${{ steps.writeback.outputs.changed }}
        run: |
          set -euo pipefail

          release_url="$(gh release view "$TAG" --json url --jq '.url')"

          {
            echo "### Release published"
            echo
            echo "- Tag: $TAG"
            echo "- Target: $TARGET"
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "- Previous release: $PREVIOUS_TAG"
            else
              echo "- Previous release: none"
            fi
            echo "- Draft: $DRAFT"
            if [[ "$DRAFT" == "true" ]]; then
              echo "- Changelog writeback: skipped (draft release)"
            elif [[ "${CHANGELOG_CHANGED:-false}" != "true" ]]; then
              echo "- Changelog writeback: skipped (no changelog diff)"
            elif [[ "${WRITEBACK_CHANGED:-false}" == "true" ]]; then
              echo "- Changelog writeback: pushed"
            else
              echo "- Changelog writeback: no commit pushed"
            fi
            echo "- URL: $release_url"
          } >> "$GITHUB_STEP_SUMMARY"
