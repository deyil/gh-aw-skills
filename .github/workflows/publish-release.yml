name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or publish, for example v1.2.3. Leave blank to auto-increment the minor version of the last release.
        required: false
        default: ""
        type: string
      title:
        description: Release title prefix. The resolved tag is always appended (e.g. "My Release v1.3.0"). Leave blank to use only the tag.
        required: false
        default: ""
        type: string
      target:
        description: Branch to target for the release. Must be a branch name (not a SHA) for non-draft releases so the changelog commit can be pushed. Defaults to main.
        required: false
        default: main
        type: string
      prerelease:
        description: Mark the release as a prerelease.
        required: false
        default: false
        type: boolean
      draft:
        description: Create the release as a draft instead of publishing it.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      resolved_tag: ${{ steps.resolve.outputs.resolved_tag }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      release_title: ${{ steps.resolve.outputs.release_title }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and title
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail

          previous_tag="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -s -r 'map(.[]) | map(select(.draft == false)) | .[0].tag_name // ""')"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"

          if [[ -n "$INPUT_TAG" ]]; then
            resolved_tag="$INPUT_TAG"
          elif [[ -n "$previous_tag" ]]; then
            # Bump the minor segment and reset patch for supported tags: v1.2.3 -> v1.3.0
            if [[ "$previous_tag" =~ ^(v)?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              tag_prefix="${BASH_REMATCH[1]}"
              major="${BASH_REMATCH[2]}"
              minor="${BASH_REMATCH[3]}"
              resolved_tag="${tag_prefix}${major}.$((minor + 1)).0"
            else
              echo "Cannot auto-increment from previous release tag: $previous_tag" >&2
              echo "Supported format is v<major>.<minor>.<patch> or <major>.<minor>.<patch>. Provide an explicit tag input." >&2
              exit 1
            fi
          else
            echo "No tag provided and no previous release found to auto-increment from." >&2
            exit 1
          fi

          if [[ ! "$resolved_tag" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Release tag contains unsupported characters: $resolved_tag" >&2
            exit 1
          fi

          echo "resolved_tag=${resolved_tag}" >> "$GITHUB_OUTPUT"

          if [[ -n "$TITLE" ]]; then
            release_title="$TITLE $resolved_tag"
          else
            release_title="$resolved_tag"
          fi
          echo "release_title=${release_title}" >> "$GITHUB_OUTPUT"

  update-changelog:
    name: Update changelog
    needs: prepare
    if: inputs.draft == false
    uses: ./.github/workflows/sync-changelog-from-release.yml
    with:
      tag: ${{ needs.prepare.outputs.resolved_tag }}
      generate_from_head: true
      target: ${{ inputs.target }}
      prerelease: ${{ inputs.prerelease }}
    secrets: inherit

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - update-changelog
    if: always() && needs.prepare.result == 'success' && (needs.update-changelog.result == 'success' || needs.update-changelog.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.resolved_tag }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.release_title }}
          TARGET: ${{ inputs.target }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
          COMMIT_SHA: ${{ needs.update-changelog.outputs.commit_sha }}
          RELEASE_BODY: ${{ needs.update-changelog.outputs.release_body }}
        run: |
          set -euo pipefail

          # Prefer the changelog-sync commit when available so release and changelog align.
          if [[ -n "$COMMIT_SHA" ]]; then
            target_sha="$COMMIT_SHA"
          else
            target_sha="$TARGET"
          fi

          release_args=(
            "$TAG"
            --title "$RELEASE_TITLE"
            --target "$target_sha"
          )

          if [[ -n "$RELEASE_BODY" ]]; then
            notes_file="$(mktemp)"
            trap 'rm -f "$notes_file"' EXIT
            printf '%s\n' "$RELEASE_BODY" > "$notes_file"
            release_args+=(--notes-file "$notes_file")
          else
            release_args+=(--generate-notes)
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if [[ "$DRAFT" == "true" ]]; then
            release_args+=(--draft)
          fi

          gh release create "${release_args[@]}"

      - name: Summarize release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.resolved_tag }}
          TARGET: ${{ inputs.target }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: |
          set -euo pipefail

          release_url="$(gh release view "$TAG" --json url --jq '.url')"

          {
            echo "### Release published"
            echo
            echo "- Tag: $TAG"
            echo "- Target: $TARGET"
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "- Previous release: $PREVIOUS_TAG"
            else
              echo "- Previous release: none"
            fi
            echo "- URL: $release_url"
          } >> "$GITHUB_STEP_SUMMARY"
