name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or publish, for example v1.2.3. Leave blank to auto-increment the minor version of the last release.
        required: false
        default: ""
        type: string
      title:
        description: Release title prefix. The resolved tag is always appended (e.g. "My Release v1.3.0"). Leave blank to use only the tag.
        required: false
        default: ""
        type: string
      target:
        description: Branch or commit to tag when the tag does not already exist.
        required: false
        default: main
        type: string
      prerelease:
        description: Mark the release as a prerelease.
        required: false
        default: false
        type: boolean
      draft:
        description: Create the release as a draft instead of publishing it.
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture previous release
        id: previous_release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          previous_tag="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -s -r 'map(.[]) | map(select(.draft == false)) | .[0].tag_name // ""')"
          echo "tag=${previous_tag}" >> "$GITHUB_OUTPUT"

          if [[ -n "$INPUT_TAG" ]]; then
            resolved_tag="$INPUT_TAG"
          elif [[ -n "$previous_tag" ]]; then
            # Bump the minor segment and reset patch for supported tags: v1.2.3 -> v1.3.0
            if [[ "$previous_tag" =~ ^(v)?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              tag_prefix="${BASH_REMATCH[1]}"
              major="${BASH_REMATCH[2]}"
              minor="${BASH_REMATCH[3]}"
              resolved_tag="${tag_prefix}${major}.$((minor + 1)).0"
            else
              echo "Cannot auto-increment from previous release tag: $previous_tag" >&2
              echo "Supported format is v<major>.<minor>.<patch> or <major>.<minor>.<patch>. Provide an explicit tag input." >&2
              exit 1
            fi
          else
            echo "No tag provided and no previous release found to auto-increment from." >&2
            exit 1
          fi

          if [[ ! "$resolved_tag" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Release tag contains unsupported characters: $resolved_tag" >&2
            exit 1
          fi

          echo "resolved_tag=${resolved_tag}" >> "$GITHUB_OUTPUT"

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.previous_release.outputs.resolved_tag }}
          TITLE: ${{ inputs.title }}
          TARGET: ${{ inputs.target }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          if [[ -n "$TITLE" ]]; then
            release_title="$TITLE $TAG"
          else
            release_title="$TAG"
          fi

          release_args=(
            "$TAG"
            --title "$release_title"
            --target "$TARGET"
            --generate-notes
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if [[ "$DRAFT" == "true" ]]; then
            release_args+=(--draft)
          fi

          gh release create "${release_args[@]}"

      - name: Append full commit list to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.previous_release.outputs.resolved_tag }}
          PREVIOUS_TAG: ${{ steps.previous_release.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"

          if [[ -n "$PREVIOUS_TAG" ]]; then
            commit_range="$PREVIOUS_TAG..$TAG"
            range_label="$PREVIOUS_TAG...$TAG"
          else
            commit_range="$TAG"
            range_label="$TAG"
          fi

          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT

          gh release view "$TAG" --json body --jq '.body' > "$notes_file"

          {
            echo
            echo "## Full Commit List"
            echo
            echo "Range: $range_label"
            echo
          } >> "$notes_file"

          commit_count=0
          while IFS=$'\t' read -r commit_sha commit_subject; do
            if [[ -z "$commit_sha" ]]; then
              continue
            fi

            commit_count=$((commit_count + 1))
            short_sha="$(git rev-parse --short "$commit_sha")"
            printf -- '- %s ([`%s`](%s/%s/commit/%s))\n' \
              "$commit_subject" \
              "$short_sha" \
              "$GITHUB_SERVER_URL" \
              "$GITHUB_REPOSITORY" \
              "$commit_sha" >> "$notes_file"
          done < <(git log --reverse --format='%H%x09%s' "$commit_range")

          if [[ "$commit_count" -eq 0 ]]; then
            echo "- No commits found for this release range." >> "$notes_file"
          fi

          gh release edit "$TAG" --notes-file "$notes_file"

      - name: Trigger changelog sync workflow
        if: inputs.draft == false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.previous_release.outputs.resolved_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh workflow run sync-changelog-from-release.yml \
            --ref "$REF_NAME" \
            -f tag="$TAG"

      - name: Summarize release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.previous_release.outputs.resolved_tag }}
          TARGET: ${{ inputs.target }}
          PREVIOUS_TAG: ${{ steps.previous_release.outputs.tag }}
        run: |
          set -euo pipefail

          release_url="$(gh release view "$TAG" --json url --jq '.url')"

          {
            echo "### Release published"
            echo
            echo "- Tag: $TAG"
            echo "- Target: $TARGET"
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "- Previous release: $PREVIOUS_TAG"
            else
              echo "- Previous release: none"
            fi
            echo "- URL: $release_url"
          } >> "$GITHUB_STEP_SUMMARY"
